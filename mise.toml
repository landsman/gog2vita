# Run `mise install`. innoextract and xdelta3 are not in mise's registry, and xdelta3 ships
# no macOS or Linux binary, so `make deps` takes both from brew or apt.
# oxfmt and oxlint are pinned in package.json, with the rest of what bun installs.
[tools]
bun = "1.4.3"
7zip = "26.05"
shellcheck = "0.11.0"
